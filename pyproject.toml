[project]
name = "sistema-bpo-financeiro"
version = "0.1.0"
description = "Sistema desktop de BPO Financeiro para escritorios de contabilidade no Brasil."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.7",
    "SQLAlchemy>=2.0",
    "pydantic>=2.0",
    "structlog>=24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "black>=24.0",
    "mypy>=1.10",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# Pacotes top-level mapeados para src/ -> imports flat sem prefixo "src.".
[tool.setuptools]
packages = ["domain", "application", "infrastructure", "ui"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = [
    "PySide6.*",
    "PySide6.QtCore.*",
    "PySide6.QtWidgets.*",
    "sqlalchemy.*",
    "sqlalchemy.orm.*",
    "structlog.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "ui.main_window"
disallow_subclassing_any = false

[[tool.mypy.overrides]]
module = "ui.views.*"
disallow_subclassing_any = false

[[tool.mypy.overrides]]
module = "infrastructure.database"
disallow_subclassing_any = false
